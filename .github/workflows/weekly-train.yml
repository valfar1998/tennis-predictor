# Ritreno settimanale modello (job pesante).
# Il train giornaliero resta in cloud-train.yml.
name: Ritreno settimanale

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dipendenze
        run: pip install -r requirements.txt

      - name: Scarica storico e allena
        env:
          PYTHONUTF8: "1"
          CLOUD_MIN_YEAR: "2010"
          CLOUD_FORCE_FEATURES: "1"
        run: python scripts/cloud_bootstrap.py

      - name: Upload artefatti modello
        uses: actions/upload-artifact@v4
        with:
          name: weekly-model-${{ github.run_id }}
          path: |
            data/models/best_model.joblib
            data/models/calibration.json
            data/models/oof_predictions.joblib
            data/processed/features.csv
            data/processed/matches.csv
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/cache/save@v4
        with:
          path: |
            data/models/best_model.joblib
            data/models/calibration.json
            data/processed/features.csv
          key: tennis-model-${{ github.run_id }}
