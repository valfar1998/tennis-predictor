name: TENNIS_PREDICTOR — Telegram alerts

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dipendenze
        run: pip install -r requirements.txt

      - name: Dati Sackmann ATP/WTA (mirror se JeffSackmann 404)
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, ".")
          from modules.data_update.sackmann import clone_sackmann_tour
          for tour in ("atp", "wta"):
              info = clone_sackmann_tour(tour=tour, dest=Path(f"data/raw/{tour}"))
              print(tour, json.dumps(info, ensure_ascii=False))
          PY

      - uses: actions/cache/restore@v4
        id: history-cache
        with:
          path: |
            data/processed/our_history.sqlite
            data/processed/our_history.sqlite-wal
            data/processed/our_history.sqlite-shm
          key: tennis-history-v1
          restore-keys: |
            tennis-history-v1
            tennis-history-

      - uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/arbworld_moneyway.json
            data/raw/oddssafari_dropping.json
          key: tennis-market-signals-${{ github.run_id }}
          restore-keys: |
            tennis-market-signals-

      - uses: actions/cache/restore@v4
        with:
          path: |
            data/models/best_model.joblib
            data/models/calibration.json
            data/processed/features.csv
          key: tennis-model-${{ github.run_id }}
          restore-keys: |
            tennis-model-

      - uses: actions/cache/restore@v4
        with:
          path: data/processed/upcoming_predictions.json
          key: tennis-upcoming-${{ github.run_id }}
          restore-keys: |
            tennis-upcoming-

      - uses: actions/cache/restore@v4
        with:
          path: data/processed/telegram_alerts_sent.json
          key: tennis-telegram-sent-${{ github.run_id }}
          restore-keys: |
            tennis-telegram-sent-

      - uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/betfair_odds.json
            data/raw/betfair.session.json
          key: tennis-betfair-${{ github.run_id }}
          restore-keys: |
            tennis-betfair-

      - name: Predizioni + Telegram (no train)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          KAMBI_UNIBET_ENABLED: "1"
          PYTHONUTF8: "1"
        run: python scripts/notify_cloud.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/raw/betfair_odds.json
            data/raw/betfair.session.json
          key: tennis-betfair-${{ github.run_id }}

      - uses: actions/cache/save@v4
        if: always() && hashFiles('data/processed/telegram_alerts_sent.json') != ''
        with:
          path: data/processed/telegram_alerts_sent.json
          key: tennis-telegram-sent-${{ github.run_id }}

      - uses: actions/cache/save@v4
        if: always() && hashFiles('data/processed/our_history.sqlite') != ''
        with:
          path: |
            data/processed/our_history.sqlite
            data/processed/our_history.sqlite-wal
            data/processed/our_history.sqlite-shm
          key: tennis-history-v1

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/raw/arbworld_moneyway.json
            data/raw/oddssafari_dropping.json
          key: tennis-market-signals-${{ github.run_id }}
