name: Weekly Sync

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  sync-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: |
          git clone --depth 1 https://github.com/JeffSackmann/tennis_atp.git data/raw/atp
          python main.py build --min-year 2010
          python main.py features
          python main.py train
