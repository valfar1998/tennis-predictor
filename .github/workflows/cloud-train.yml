# 05:00 UTC = 07:00 in Italia (ora legale). In inverno è 06:00.
# Train + predizioni + Telegram (job giornaliero).
name: Aggiorna dati e modello

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dipendenze
        run: pip install -r requirements.txt

      - uses: actions/cache/restore@v4
        id: history-cache
        with:
          path: |
            data/processed/our_history.sqlite
            data/processed/our_history.sqlite-wal
            data/processed/our_history.sqlite-shm
          key: tennis-history-v1
          restore-keys: |
            tennis-history-v1
            tennis-history-

      - uses: actions/cache/restore@v4
        with:
          path: data/processed/upcoming_predictions.json
          key: tennis-upcoming-${{ github.run_id }}
          restore-keys: |
            tennis-upcoming-

      - uses: actions/cache/restore@v4
        id: features-cache
        with:
          path: |
            data/processed/matches.csv
            data/processed/features.csv
            data/processed/features_v2.parquet
          key: tennis-features-v1
          restore-keys: |
            tennis-features-v1
            tennis-features-

      - uses: actions/cache/restore@v4
        id: model-cache
        with:
          path: |
            data/models/best_model.joblib
            data/models/calibration.json
            data/models/meta_learner.joblib
            data/models/stacker.joblib
            data/models/oof_predictions.joblib
          key: tennis-model-${{ github.run_id }}
          restore-keys: |
            tennis-model-

      - uses: actions/cache/restore@v4
        id: sackmann-cache
        with:
          path: |
            data/raw/atp
            data/raw/wta
          key: tennis-sackmann-v1
          restore-keys: |
            tennis-sackmann-v1
            tennis-sackmann-

      - name: Scarica storico e allena
        env:
          PYTHONUTF8: "1"
          CLOUD_MIN_YEAR: "2010"
          CLOUD_FORCE_FEATURES: "0"
        run: python scripts/run_retrain_pipeline.py

      - name: Settle + apprendimento online
        env:
          PYTHONUTF8: "1"
        run: python scripts/cloud_learn.py

      - name: Upload modello (artefatto)
        uses: actions/upload-artifact@v4
        with:
          name: best-model-${{ github.run_id }}
          path: |
            data/models/best_model.joblib
            data/models/calibration.json
            data/models/oof_predictions.joblib
            data/models/stacker.joblib
            data/models/meta_learner.joblib
            data/processed/features.csv
            data/processed/features_v2.parquet
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/cache/save@v4
        with:
          path: |
            data/models/best_model.joblib
            data/models/calibration.json
            data/models/meta_learner.joblib
            data/processed/features.csv
            data/processed/features_v2.parquet
          key: tennis-model-${{ github.run_id }}

      - uses: actions/cache/restore@v4
        with:
          path: data/processed/telegram_alerts_sent.json
          key: tennis-telegram-sent-${{ github.run_id }}
          restore-keys: |
            tennis-telegram-sent-

      - uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/arbworld_moneyway.json
            data/raw/oddssafari_dropping.json
          key: tennis-market-signals-${{ github.run_id }}
          restore-keys: |
            tennis-market-signals-

      - uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/betfair_odds.json
            data/raw/betfair.session.json
          key: tennis-betfair-${{ github.run_id }}
          restore-keys: |
            tennis-betfair-

      - name: Dati Sackmann ATP/WTA (mirror se JeffSackmann 404)
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, ".")
          from modules.data_update.sackmann import clone_sackmann_tour
          for tour in ("atp", "wta"):
              info = clone_sackmann_tour(tour=tour, dest=Path(f"data/raw/{tour}"))
              print(tour, json.dumps(info, ensure_ascii=False), flush=True)
          PY

      - name: Predizioni + Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          PYTHONUTF8: "1"
        run: python scripts/notify_cloud.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/raw/betfair_odds.json
            data/raw/betfair.session.json
          key: tennis-betfair-${{ github.run_id }}

      - uses: actions/cache/save@v4
        if: always() && hashFiles('data/processed/telegram_alerts_sent.json') != ''
        with:
          path: data/processed/telegram_alerts_sent.json
          key: tennis-telegram-sent-${{ github.run_id }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/raw/arbworld_moneyway.json
            data/raw/oddssafari_dropping.json
          key: tennis-market-signals-${{ github.run_id }}

      - uses: actions/cache/save@v4
        if: always() && hashFiles('data/processed/our_history.sqlite') != ''
        with:
          path: |
            data/processed/our_history.sqlite
            data/processed/our_history.sqlite-wal
            data/processed/our_history.sqlite-shm
          key: tennis-history-v1

      - uses: actions/cache/save@v4
        if: always() && hashFiles('data/processed/features_v2.parquet') != ''
        with:
          path: |
            data/processed/matches.csv
            data/processed/features.csv
            data/processed/features_v2.parquet
          key: tennis-features-v1

      - uses: actions/cache/save@v4
        if: always() && hashFiles('data/processed/upcoming_predictions.json') != ''
        with:
          path: data/processed/upcoming_predictions.json
          key: tennis-upcoming-${{ github.run_id }}

      - uses: actions/cache/save@v4
        if: always() && hashFiles('data/raw/atp/atp_players.csv') != ''
        with:
          path: |
            data/raw/atp
            data/raw/wta
          key: tennis-sackmann-v1

      - name: Notifica esito run
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path(".").resolve()))
          from scripts.notify_cloud import notify_run_status
          notify_run_status(
              status=os.environ.get("RUN_STATUS", "unknown"),
              run_id=os.environ.get("RUN_ID", ""),
              repo=os.environ.get("REPO", ""),
          )
          print("notifica esito inviata")
          PY
