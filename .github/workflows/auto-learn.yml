# Settle pick pendenti + online learn + audit BCR — persistenza stato su Git.
# 04:00 e 16:00 UTC (~06:00 / 18:00 IT estate).
name: Automated Settle & Online Learn

on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  settle-and-learn:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Mirror Sackmann ATP/WTA (se assente in CI)
        env:
          PYTHONUTF8: "1"
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, ".")
          from modules.data_update.sackmann import clone_sackmann_tour
          for tour in ("atp", "wta"):
              info = clone_sackmann_tour(tour=tour, dest=Path(f"data/raw/{tour}"))
              print(tour, json.dumps(info, ensure_ascii=False))
          PY

      - name: Sync latest match results (TML + Sackmann)
        env:
          PYTHONUTF8: "1"
        run: python main.py sync

      - name: Restore Betfair cache / market registry
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/betfair_odds.json
            data/raw/betfair.session.json
            data/raw/betfair_market_ids.json
            data/raw/betfair_settled.json
            data/raw/kambi_unibet_odds.json
            data/raw/kambi_last_odds.json
          key: tennis-betfair-${{ github.run_id }}
          restore-keys: |
            tennis-betfair-

      - name: Execute settle & online calibration
        env:
          PYTHONUTF8: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_SOFA_HOST: ${{ secrets.RAPIDAPI_SOFA_HOST }}
          RAPIDAPI_TENNIS_HOST: ${{ secrets.RAPIDAPI_TENNIS_HOST }}
          RAPIDAPI_DAILY_LIMIT: "50"
          RAPIDAPI_FETCH_TENNIS: "0"
          KAMBI_UNIBET_ENABLED: "1"
        run: python scripts/auto_learn_cloud.py --notify

      - name: Save Betfair cache / market registry
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw/betfair_odds.json
            data/raw/betfair.session.json
            data/raw/betfair_market_ids.json
            data/raw/betfair_settled.json
            data/raw/kambi_unibet_odds.json
            data/raw/kambi_last_odds.json
          key: tennis-betfair-${{ github.run_id }}

      - name: Audit live metrics & BCR (Pinnacle)
        env:
          PYTHONUTF8: "1"
        run: python main.py metrics

      - name: Checkpoint SQLite WAL
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = Path("data/processed/our_history.sqlite")
          if db.is_file():
              c = sqlite3.connect(db)
              c.execute("PRAGMA wal_checkpoint(TRUNCATE)")
              c.close()
              print("WAL checkpoint OK")
          else:
              print("SQLite assente, skip checkpoint")
          PY

      - name: Commit & push updated state
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git config --local pull.rebase true

          git add -f \
            data/processed/our_history.sqlite \
            data/models/calibration.json \
            data/models/online_learn_report.json \
            data/processed/live_metrics.json \
            data/processed/risk_state.json \
            data/raw/betfair_market_ids.json \
            data/raw/kambi_last_odds.json \
            2>/dev/null || true

          if git diff --staged --quiet; then
            echo "Nessun aggiornamento di stato da salvare."
            exit 0
          fi

          git commit -m "auto-learn: settle, ricalibrazione online e audit BCR [skip ci]"

          # main may move during the ~8m job (manual pushes / other workflows).
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push OK (attempt ${attempt})"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebase onto origin/main..."
            git fetch origin main
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          echo "Push failed after retries"
          exit 1
